spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/seu_banco
    driver-class-name: org.postgresql.Driver
    username: seu_usuario
    password: sua_senha

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

